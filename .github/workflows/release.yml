name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-release:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.result }}
    steps:
      - uses: actions/github-script@v7
        id: create
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            const body = [
              "## Affiche Studio",
              "",
              "Générateur d'affiches assisté par IA — HTML/CSS, export PNG.",
              "",
              "### Téléchargements",
              "- **Windows** : `.msi`, `.exe`, `.zip`",
              "- **macOS** : `.dmg` Intel et Apple Silicon, `.zip`",
              "- **Linux** : `.deb`, `.AppImage`, `.zip`",
              "- **Flatpak** : `affiche-studio.flatpak`",
              "",
              "Voir le [README](https://github.com/unstasium/affiche-studio#readme) pour la configuration de l'API."
            ].join("\n");
            try {
              const { data } = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag,
              });
              return data.id;
            } catch (error) {
              const { data } = await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tag,
                name: `Affiche Studio ${tag}`,
                body,
                draft: true,
                prerelease: false,
              });
              return data.id;
            }

  build:
    needs: create-release
    if: always()
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
          - platform: macos-15-intel
            args: "--target x86_64-apple-darwin"
            target: x86_64-apple-darwin
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm install

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          includeUpdaterJson: false
          args: ${{ matrix.args }}

      - name: Upload Linux binary for Flatpak
        if: matrix.platform == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: linux-binary
          path: src-tauri/target/release/affiche-studio
          if-no-files-found: error

      - name: Create portable ZIP (Linux)
        if: matrix.platform == 'ubuntu-22.04' && github.ref_type == 'tag'
        run: |
          cd src-tauri/target/release
          zip -j "Affiche-Studio-${GITHUB_REF_NAME}-linux-x64.zip" affiche-studio
          gh release upload "${GITHUB_REF_NAME}" "Affiche-Studio-${GITHUB_REF_NAME}-linux-x64.zip" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create portable ZIP (Windows)
        if: matrix.platform == 'windows-latest' && github.ref_type == 'tag'
        shell: pwsh
        run: |
          Compress-Archive -Path "src-tauri/target/release/affiche-studio.exe" -DestinationPath "Affiche-Studio-$env:GITHUB_REF_NAME-windows-x64.zip"
          gh release upload "$env:GITHUB_REF_NAME" "Affiche-Studio-$env:GITHUB_REF_NAME-windows-x64.zip" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create portable ZIP (macOS)
        if: startsWith(matrix.platform, 'macos') && github.ref_type == 'tag'
        run: |
          cd "src-tauri/target/${{ matrix.target }}/release/bundle/macos"
          ditto -c -k --sequesterRsrc --keepParent "Affiche Studio.app" "../../../../../../Affiche-Studio-${GITHUB_REF_NAME}-${{ matrix.target }}.zip"
          cd "../../../../../../"
          gh release upload "${GITHUB_REF_NAME}" "Affiche-Studio-${GITHUB_REF_NAME}-${{ matrix.target }}.zip" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  flatpak:
    needs: [build, create-release]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    # Le runtime GNOME doit fournir webkit2gtk-4.1 ; job non bloquant tant que
    # le bundle Flatpak n'a pas été validé manuellement.
    continue-on-error: true
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-47
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: linux-binary
          path: flatpak

      - name: Make binary executable
        run: chmod +x flatpak/affiche-studio

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: affiche-studio.flatpak
          manifest-path: flatpak/com.affichestudio.AfficheStudio.yml
          cache-key: flatpak-${{ github.sha }}

      - name: Upload Flatpak bundle
        uses: actions/upload-artifact@v4
        with:
          name: affiche-studio-flatpak
          path: affiche-studio.flatpak
          if-no-files-found: warn

      - name: Attach Flatpak to the release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: affiche-studio.flatpak
